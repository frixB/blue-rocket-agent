name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Generated CSS matches tokens.json
        run: |
          npm run tokens:build
          git diff --exit-code styles/ || (echo "::error::styles/ is out of date. Run npm run tokens:build and commit." && exit 1)

      - name: Token changes ship in their own PR
        if: github.event_name == 'pull_request'
        run: |
          changed=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          if echo "$changed" | grep -q '^design-tokens/tokens.json$'; then
            others=$(echo "$changed" | grep -v -E '^(design-tokens/|styles/tokens\.css|styles/typography\.css)' || true)
            if [ -n "$others" ]; then
              echo "::error::tokens.json changed alongside feature files. Split the token pull into its own PR."
              echo "$others"
              exit 1
            fi
          fi

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
